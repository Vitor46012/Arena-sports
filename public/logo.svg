<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 370" width="100%" height="100%">
  <defs>
    <style>
      .white-cream { fill: #F1EFEA; }
      .copper-review { fill: #A56D48; }
      .red-dot { fill: #BD1E2D; }
      .sports-heading {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 900;
        font-style: normal;
        fill: #F1EFEA;
      }
      .review-heading {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 500;
        font-style: normal;
        letter-spacing: 0.28em;
        fill: #A56D48;
      }
    </style>
  </defs>

  <!-- ==================== EMBLEM (LEFT) ==================== -->
  <g transform="translate(190, 185)">
    <!-- Red recording dot at top dead center -->
    <circle cx="0" cy="-148" r="9.5" class="red-dot" />

    <!-- 1. Outer Ring (stroke width ~ 10px, radius 148, open at bottom-right for the arrow) -->
    <path
      d="M -15 -148
         A 148 148 0 1 0 148 0
         A 148 148 0 0 0 120 85"
      fill="none"
      stroke="#F1EFEA"
      stroke-width="9"
      stroke-linecap="round"
    />
    <path
      d="M 15 -148
         A 148 148 0 0 1 70 -131"
      fill="none"
      stroke="#F1EFEA"
      stroke-width="9"
      stroke-linecap="round"
    />

    <!-- 2. Middle Ring (radius ~ 124, open at top and bottom-right) -->
    <path
      d="M -25 -122
         A 124 124 0 1 0 100 75"
      fill="none"
      stroke="#F1EFEA"
      stroke-width="8"
      stroke-linecap="round"
    />
    <path
      d="M 25 -122
         A 124 124 0 0 1 115 -45"
      fill="none"
      stroke="#F1EFEA"
      stroke-width="8"
      stroke-linecap="round"
    />

    <!-- 3. Inner Ring (radius ~ 100, broken at top) -->
    <path
      d="M -30 -95
         A 100 100 0 1 0 85 55"
      fill="none"
      stroke="#F1EFEA"
      stroke-width="7"
      stroke-linecap="round"
    />

    <!-- 4. Dynamic Swooping Bottom Arrow -->
    <!-- Arc curving under the runner pointing up and right -->
    <path
      d="M -90 92
         C -40 128, 45 125, 125 70
         L 125 105
         L 168 55
         L 95 50
         L 110 72
         C 40 115, -35 116, -85 82
         Z"
      class="white-cream"
    />

    <!-- 5. Stylized Athlete Silhouette (exact form: head, straight forward arm, running legs) -->
    <g class="white-cream">
      <!-- Head -->
      <circle cx="12" cy="-80" r="16.5" />

      <!-- Torso with athletic forward lean -->
      <path
        d="M 5 -60
           C -5 -50, -18 -32, -22 -10
           C -24 6, -20 22, -14 36
           C -4 38, 12 30, 18 16
           C 25 -2, 28 -30, 20 -52
           C 16 -58, 10 -60, 5 -60
           Z"
      />

      <!-- Right Arm: extended horizontally forward to the right -->
      <path
        d="M 18 -42
           C 35 -43, 62 -44, 88 -45
           C 93 -45, 95 -38, 90 -37
           C 66 -35, 40 -34, 20 -33
           Z"
      />

      <!-- Left Arm: bent back in running stride -->
      <path
        d="M -8 -40
           C -22 -30, -42 -16, -58 -2
           C -62 3, -66 -2, -62 -7
           C -48 -20, -30 -33, -12 -44
           Z"
      />

      <!-- Front Leg (Right): driving forward, knee bent at ~90 deg, shin downward -->
      <path
        d="M 8 28
           C 18 36, 32 50, 40 68
           C 38 75, 28 80, 20 72
           C 14 62, 5 50, -4 40
           Z"
      />
      <path
        d="M 40 68
           C 30 84, 15 106, 0 126
           C -4 130, -10 128, -8 122
           C 3 105, 18 82, 26 68
           Z"
      />

      <!-- Back Leg (Left): extended behind with bent knee upward -->
      <path
        d="M -16 28
           C -32 24, -54 22, -72 32
           C -76 34, -80 30, -78 24
           C -74 16, -50 14, -26 18
           Z"
      />
      <path
        d="M -78 24
           C -84 25, -96 32, -94 40
           C -92 46, -78 45, -70 38
           Z"
      />
    </g>
  </g>

  <!-- ==================== TYPOGRAPHY (RIGHT) ==================== -->
  <g transform="translate(415, 0)">
    <!-- SPORTS: Bold, Solid, Crisp Off-White -->
    <text
      x="0"
      y="172"
      font-size="140"
      letter-spacing="0.02em"
      class="sports-heading"
    >SPORTS</text>

    <!-- Horizontal Divider Line -->
    <line
      x1="0"
      y1="190"
      x2="465"
      y2="190"
      stroke="#F1EFEA"
      stroke-width="5"
      stroke-linecap="square"
    />

    <!-- REVIEW: Refined Warm Copper/Bronze Sans-Serif with Elegant Wide Spacing -->
    <text
      x="2"
      y="278"
      font-size="94"
      class="review-heading"
    >REVIEW</text>
  </g>
</svg>
