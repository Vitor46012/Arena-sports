<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Blue Gradient for Outer Swoop & SPORTS text -->
    <linearGradient id="fullLogoBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A3FF" />
      <stop offset="40%" stop-color="#0066CC" />
      <stop offset="100%" stop-color="#003D82" />
    </linearGradient>

    <!-- Orange Gradient for Inner Swoop, Arrow, Line & REVIEW text -->
    <linearGradient id="fullLogoOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9900" />
      <stop offset="50%" stop-color="#FF6600" />
      <stop offset="100%" stop-color="#E63900" />
    </linearGradient>

    <!-- Typography Blue for SPORTS -->
    <linearGradient id="sportsTextGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#185a9d" />
      <stop offset="100%" stop-color="#0f386b" />
    </linearGradient>

    <!-- Runner Blue Gradient -->
    <linearGradient id="fullRunnerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0088FF" />
      <stop offset="50%" stop-color="#0055B3" />
      <stop offset="100%" stop-color="#003366" />
    </linearGradient>

    <!-- Orange Highlight Gradient -->
    <linearGradient id="fullHighlightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFAA00" />
      <stop offset="100%" stop-color="#FF5500" />
    </linearGradient>

    <filter id="fullShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- LEFT ICON EMBLEM (Scaled and centered at ~200, 200) -->
  <g transform="translate(30, 25) scale(0.7)" filter="url(#fullShadow)">
    <!-- 1. OUTER BLUE SWOOSH -->
    <path
      d="M 330 75 
         C 200 45, 65 140, 65 265 
         C 65 375, 150 440, 260 440 
         C 175 425, 115 365, 115 270 
         C 115 170, 205 100, 310 115 
         C 355 122, 385 145, 400 175 
         C 410 140, 380 95, 330 75 Z"
      fill="url(#fullLogoBlue)"
    />

    <path
      d="M 370 120 
         C 435 180, 445 285, 395 365 
         L 435 345 
         C 475 260, 455 160, 370 120 Z"
      fill="url(#fullLogoBlue)"
    />

    <path
      d="M 140 375 
         C 195 435, 290 445, 370 395 
         C 300 415, 210 395, 155 350 
         Z"
      fill="url(#fullLogoBlue)"
    />

    <!-- 2. INNER ORANGE SWOOSH & UPWARD ARROW -->
    <path
      d="M 190 160 
         C 240 100, 340 105, 395 165 
         C 425 200, 435 250, 420 300 
         C 400 240, 370 185, 315 155 
         C 265 130, 215 140, 190 160 Z"
      fill="url(#fullLogoOrange)"
    />

    <path
      d="M 155 385 
         C 195 440, 280 475, 360 450 
         C 410 430, 440 390, 440 390 
         L 440 435 
         L 480 340 
         L 375 365 
         L 405 385 
         C 370 415, 295 425, 225 390 
         C 185 370, 165 350, 155 385 Z"
      fill="url(#fullLogoOrange)"
    />

    <!-- 3. REC INDICATOR -->
    <circle cx="135" cy="275" r="11" fill="#FF2E2E" />
    <text
      x="152"
      y="283"
      fill="#FF2E2E"
      font-family="'Sora', 'Arial Black', sans-serif"
      font-size="22"
      font-weight="900"
      letter-spacing="1"
    >
      REC
    </text>

    <!-- 4. PLAY BUTTON TRIANGLE -->
    <polygon
      points="340,260 340,290 368,275"
      fill="url(#fullLogoBlue)"
    />

    <!-- 5. ATHLETE SILHOUETTE -->
    <circle cx="295" cy="180" r="16" fill="url(#fullRunnerGrad)" />

    <path
      d="M 210 245 
         C 200 230, 215 210, 230 220 
         C 240 230, 235 255, 220 255 
         C 210 255, 205 250, 210 245 Z"
      fill="url(#fullRunnerGrad)"
    />
    <path d="M 214 225 Q 224 238 223 250" stroke="#FFAA00" stroke-width="2.5" fill="none" />

    <path
      d="M 285 198 
         C 270 205, 255 215, 238 220 
         C 230 223, 232 235, 242 238 
         C 255 240, 268 232, 275 235 
         L 260 270 
         C 250 285, 240 295, 230 300 
         C 245 308, 275 295, 288 280 
         C 298 268, 305 250, 305 230 
         C 305 215, 298 202, 285 198 Z"
      fill="url(#fullRunnerGrad)"
    />

    <path
      d="M 300 215 
         C 315 220, 328 230, 340 225 
         C 345 222, 348 215, 340 210 
         C 330 205, 315 208, 300 205 Z"
      fill="url(#fullRunnerGrad)"
    />
    <path
      d="M 338 210 
         L 348 200 
         L 353 205 
         L 348 215 
         L 354 218 
         L 346 226 Z"
      fill="url(#fullRunnerGrad)"
    />

    <path
      d="M 252 238 
         C 260 255, 258 275, 245 290 
         C 248 282, 258 265, 252 248 Z"
      fill="url(#fullHighlightGrad)"
    />
    <path
      d="M 280 205 
         C 295 218, 298 238, 290 255 
         C 298 240, 295 220, 285 208 Z"
      fill="url(#fullHighlightGrad)"
    />

    <path
      d="M 255 275 
         C 245 295, 220 330, 195 345 
         C 188 350, 180 355, 175 375 
         C 172 385, 178 392, 190 380 
         C 200 370, 205 350, 220 335 
         C 238 318, 260 295, 270 280 Z"
      fill="url(#fullRunnerGrad)"
    />

    <path
      d="M 280 270 
         C 295 285, 315 305, 335 320 
         C 342 325, 340 338, 330 338 
         C 318 338, 305 320, 290 305 
         C 280 295, 275 282, 280 270 Z"
      fill="url(#fullRunnerGrad)"
    />
  </g>

  <!-- RIGHT SIDE TYPOGRAPHY -->
  <g transform="translate(420, 0)">
    <!-- 'SPORTS' Heading in Deep Royal Blue -->
    <text
      x="0"
      y="180"
      fill="url(#sportsTextGrad)"
      font-family="'Sora', 'Arial Black', -apple-system, sans-serif"
      font-size="140"
      font-weight="900"
      letter-spacing="-1"
    >
      SPORTS
    </text>

    <!-- Orange Horizontal Dividing Bar -->
    <rect
      x="2"
      y="205"
      width="640"
      height="14"
      rx="7"
      fill="url(#fullLogoOrange)"
    />

    <!-- 'REVIEW' Subheading in Vivid Orange -->
    <text
      x="5"
      y="295"
      fill="url(#fullLogoOrange)"
      font-family="'Sora', 'Arial Black', -apple-system, sans-serif"
      font-size="64"
      font-weight="900"
      letter-spacing="29"
    >
      REVIEW
    </text>

    <!-- Tagline in Clean White / Silver -->
    <text
      x="6"
      y="348"
      fill="#F1F5F9"
      font-family="'Inter', sans-serif"
      font-size="28"
      font-weight="700"
      letter-spacing="5"
      opacity="0.95"
    >
      SEUS MELHORES MOMENTOS EM ALTA DEFINIÇÃO
    </text>
  </g>
</svg>
